# LE PAQUET iOS, FABRIQUÉ PAR GITHUB SUR UN MAC.
#
# 🔴 IL N'Y A PAS D'AUTRE VOIE. Xcode n'existe pas sous Windows, et Apple
# n'accepte aucun fichier produit autrement. La machine d'Alex ne peut donc pas
# fabriquer ce paquet, quoi qu'on installe dessus : il faut un Mac, et celui de
# GitHub fait l'affaire.
#
# ⚠️ LES MINUTES macOS COMPTENT DIX FOIS PLUS que les minutes Linux dans le
# quota GitHub. Un build prend une dizaine de minutes, donc une centaine de
# minutes facturées : c'est tenable quand on dépose, pas quand on pousse.
# D'où le déclenchement à la main, comme pour Android.
#
# ⚠️ CE PAQUET NE CONTIENT PAS L'APPLICATION, IL LA POINTE
# (`https://www.yoppaa.app`). Aucun secret Supabase ni Stripe ne transite ici.
name: Paquet iOS

on:
  workflow_dispatch:
    inputs:
      version_nom:
        description: 'Version affichée sur l''App Store (ex. 1.0.0)'
        required: true
        default: '1.0.0'
      version_build:
        description: 'Numéro de build, STRICTEMENT croissant à chaque dépôt'
        required: true
        default: '1'

jobs:
  construire:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      # ⚠️ LE BANC AVANT LE PAQUET. Une revue Apple prend des jours ; un aller
      # -retour pour un défaut qu'on connaissait déjà en coûte autant.
      - name: Vérifier l'enveloppe et les notifications
        run: npm run verif:push-natif

      - name: Synchroniser Capacitor
        run: npx cap sync ios

      - name: Installer les pods
        working-directory: ios/App
        run: pod install --repo-update

      # 🔴 LE NUMÉRO DE BUILD DOIT CROÎTRE À CHAQUE DÉPÔT. Apple refuse un
      # numéro déjà vu, même si la version affichée change.
      - name: Poser la version
        working-directory: ios/App
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ inputs.version_nom }}" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ inputs.version_build }}" App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" App/Info.plist

      # 🔴 LES CERTIFICATS APPLE. Sans eux, on obtient au mieux une archive non
      # signée, inutilisable pour un dépôt.
      # ⚠️ ILS ARRIVENT EN SECRETS, JAMAIS DANS LE DÉPÔT : un certificat de
      # distribution volé permet de signer n'importe quoi au nom d'Avcotech.
      # ⚠️ ET LE TROUSSEAU EST TEMPORAIRE : il vit le temps du build et repart
      # avec la machine.
      #
      # 🔴 CETTE ÉTAPE ÉTAIT TOUJOURS SAUTÉE (corrigé le 17/09, frère du même
      # défaut dans `paquet-android.yml`). Elle portait
      # `if: env.CERTIFICAT_P12_B64 != ''`, or un `if` est évalué AVANT l'étape
      # et la variable n'existait que dans son `env:`. La condition était donc
      # toujours fausse : le trousseau n'était jamais monté, et l'archivage
      # échouait plus loin sur une erreur de signature incompréhensible.
      #
      # ⚠️ ET ELLE N'EST PLUS FACULTATIVE : sans certificat, il n'y a rien à
      # déposer. Mieux vaut échouer ici, avec la raison, qu'au milieu de Xcode.
      - name: Préparer la signature
        env:
          CERTIFICAT_P12_B64: ${{ secrets.CERTIFICAT_P12_B64 }}
          CERTIFICAT_MDP: ${{ secrets.CERTIFICAT_MDP }}
          PROFIL_MOBILEPROVISION_B64: ${{ secrets.PROFIL_MOBILEPROVISION_B64 }}
        run: |
          set -euo pipefail
          for v in CERTIFICAT_P12_B64 CERTIFICAT_MDP PROFIL_MOBILEPROVISION_B64; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Le secret $v manque. Sans les trois, rien ne peut etre signe."
              exit 1
            fi
          done
          echo "$CERTIFICAT_P12_B64" | base64 -d > certificat.p12
          echo "$PROFIL_MOBILEPROVISION_B64" | base64 -d > profil.mobileprovision
          security create-keychain -p "build" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "build" build.keychain
          security import certificat.p12 -k build.keychain -P "$CERTIFICAT_MDP" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "build" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profil.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          rm -f certificat.p12 profil.mobileprovision

      # 🔴 SIGNATURE MANUELLE, ET C EST TOUT L ENJEU (17/09). Le projet Xcode
      # porte `CODE_SIGN_STYLE = Automatic` : Xcode voudrait alors se connecter
      # a un compte Apple pour gerer les certificats lui-meme. Sur un runner
      # GitHub il n y a aucune session, et l archive echoue.
      #
      # ⚠️ ON NE TOUCHE PAS AU PROJET, ON SURCHARGE A LA LIGNE DE COMMANDE : le
      # `.xcodeproj` reste ouvrable tel quel sur un Mac de developpement, ou la
      # signature automatique est au contraire commode.
      #
      # ⚠️ `PROVISIONING_PROFILE_SPECIFIER` PREND LE NOM DU PROFIL, pas son
      # fichier. Il est fixe par un secret parce qu il change a chaque
      # regeneration du profil chez Apple, et qu un nom fige ici serait faux au
      # premier renouvellement, sans que rien ne le dise.
      - name: Archiver
        working-directory: ios/App
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFIL_NOM: ${{ secrets.PROFIL_NOM }}
        run: |
          if [ -z "$TEAM_ID" ] || [ -z "$PROFIL_NOM" ]; then
            echo "::error::APPLE_TEAM_ID ou PROFIL_NOM manque dans les secrets du depot."
            exit 1
          fi
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFIL_NOM" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive

      # 🔴 L EXPORT NE DEVINE NI L EQUIPE NI LE PROFIL. Cette liste ne portait
      # que la methode : sur un compte a plusieurs equipes l export echoue, et
      # meme sur une seule il repasse en signature automatique, donc il redemande
      # une session Apple qui n existe pas ici.
      #
      # ⚠️ `provisioningProfiles` ASSOCIE LE BUNDLE AU NOM DU PROFIL. Sans cette
      # correspondance, le profil importe trois etapes plus haut est copie dans
      # le dossier du runner et n est jamais utilise.
      - name: Exporter l'IPA
        working-directory: ios/App
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFIL_NOM: ${{ secrets.PROFIL_NOM }}
        run: |
          cat > export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.yoppaa.client</key><string>${PROFIL_NOM}</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportOptionsPlist export.plist -exportPath build/ipa

      # ⚠️ ON RELIT CE QU ON A PRODUIT. Un `.ipa` peut sortir non signe sans que
      # `xcodebuild` ne rende une erreur : c est exactement ce qui est arrive
      # cote Android, ou `jarsigner -verify` rendait 0 sur un paquet NON signe.
      - name: Verifier la signature du paquet
        working-directory: ios/App
        run: |
          IPA=$(ls build/ipa/*.ipa 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then echo "::error::Aucun .ipa produit."; exit 1; fi
          rm -rf verif && mkdir verif && unzip -q "$IPA" -d verif
          APP=$(ls -d verif/Payload/*.app | head -1)
          if [ -z "$APP" ]; then echo "::error::Le .ipa ne contient pas de Payload/*.app"; exit 1; fi
          codesign -dv --verbose=4 "$APP" 2>&1 | tee signature.txt
          # ⚠️ ON LIT LA PHRASE, PAS LE CODE DE SORTIE. C est la lecon du paquet
          # Android : une commande de verification peut rendre 0 sans rien avoir
          # verifie.
          grep -q "Authority=Apple Distribution" signature.txt \
            || { echo "::error::Le paquet n est PAS signe par un certificat de distribution."; exit 1; }
          grep -q "app.yoppaa.client" signature.txt \
            || { echo "::error::Le paquet ne porte pas le bundle app.yoppaa.client."; exit 1; }
          echo "Signature verifiee : distribution, bundle app.yoppaa.client."

      - name: Récupérer le paquet
        uses: actions/upload-artifact@v4
        with:
          name: yoppaa-ios-${{ inputs.version_nom }}
          path: ios/App/build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30
