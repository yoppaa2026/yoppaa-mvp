<!--
  CETTE PAGE N'EST PRESQUE JAMAIS AFFICHÉE, ET C'EST VOULU.

  ⚠️ Capacitor EXIGE un `webDir`, même quand l'application est servie depuis

  🔴 IL POINTAIT D'ABORD VERS `public/`, ce qui recopiait 1,2 Mo d'icônes et de
  splash dans chaque paquet natif, à chaque synchronisation, pour du contenu
  que la WebView ne sert jamais. Un dossier dédié d'un seul fichier fait le
  même travail sans alourdir l'app que les gens téléchargent.

  Elle s'affiche dans un seul cas : la WebView n'a pas encore joint le site.
  Autant qu'elle dise quelque chose d'utile plutôt que d'être blanche.
-->
