# LE PAQUET ANDROID, FABRIQUÉ PAR GITHUB.
#
# POURQUOI ICI ET PAS SUR LA MACHINE D'ALEX. Elle tourne sous Windows et n'a ni
# Java ni le SDK Android : il faudrait installer plusieurs gigaoctets d'outils
# pour produire un fichier qu'on dépose quatre fois par an. Le runner de GitHub
# les a déjà.
#
# ⚠️ CE PAQUET NE CONTIENT PAS L'APPLICATION, IL LA POINTE. `capacitor.config.ts`
# vise `https://www.yoppaa.app` : le build n'a donc besoin d'AUCUNE variable
# Supabase ou Stripe, et aucun secret d'exécution ne transite ici. C'est aussi
# pour cela qu'il n'y a rien à reconstruire quand le site change.
#
# ⚠️ DÉCLENCHEMENT À LA MAIN UNIQUEMENT. Un paquet signé produit à chaque
# poussée, c'est un numéro de version qui s'envole et des artefacts qu'on ne
# regarde jamais. On le lance quand on dépose.
name: Paquet Android

on:
  workflow_dispatch:
    inputs:
      version_nom:
        description: 'Nom de version affiché dans le store (ex. 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Numéro de build, STRICTEMENT croissant à chaque dépôt'
        required: true
        default: '1'

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      # ⚠️ LE BANC AVANT LE PAQUET. Déposer sur un store prend des jours à
      # corriger : autant ne pas y envoyer une version dont on sait déjà
      # qu'elle est cassée.
      - name: Vérifier l'enveloppe et les notifications
        run: npm run verif:push-natif

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Le dossier `android/` est versionné : il n'y a rien à générer, seulement
      # à resynchroniser la configuration et les plugins.
      - name: Synchroniser Capacitor
        run: npx cap sync android

      # 🔴 LE NUMÉRO DE BUILD DOIT CROÎTRE À CHAQUE DÉPÔT, sinon Google refuse le
      # fichier sans expliquer autre chose que « version code déjà utilisé ».
      #
      # ⚠️ ET UN `sed` QUI NE TROUVE RIEN NE DIT RIEN. Si `build.gradle` change
      # de forme un jour, le remplacement devient muet et le paquet repart avec
      # l'ancien numéro. Le premier dépôt passerait ; le deuxième serait refusé,
      # et la cause serait à chercher très loin de là. On vérifie donc que la
      # valeur écrite est bien celle demandée.
      - name: Poser la version
        run: |
          set -euo pipefail
          G=android/app/build.gradle
          sed -i "s/versionCode .*/versionCode ${{ inputs.version_code }}/" "$G"
          sed -i "s/versionName .*/versionName \"${{ inputs.version_nom }}\"/" "$G"
          grep -E "versionCode|versionName" "$G"
          grep -q "versionCode ${{ inputs.version_code }}" "$G" || {
            echo "::error::Le numero de build n a pas ete pose. Le paquet garderait l ancien, et le depot serait refuse."
            exit 1
          }
          grep -q "versionName \"${{ inputs.version_nom }}\"" "$G" || {
            echo "::error::Le nom de version n a pas ete pose."
            exit 1
          }

      # ⚠️ UN BUNDLE (.aab), PAS UN APK : Google Play n'accepte plus que ce
      # format pour les nouvelles applications.
      # 🔴 `chmod +x` AVANT DE LANCER, ET CE N'EST PAS UNE PRÉCAUTION OISIVE.
      # Le dépôt vit sous Windows, où Git ne conserve pas le bit exécutable :
      # `gradlew` est arrivé ici en 100644, et le runner Linux a répondu
      # « Permission denied » avec un code 126 qui ne nomme rien.
      #
      # ⚠️ LE BIT EST AUSSI POSÉ DANS L'INDEX GIT (100755), mais cette ligne
      # reste : `npx cap sync` ou une régénération du projet natif le
      # réécrirait sans, et on repartirait pour le même diagnostic.
      - name: Construire le bundle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease

      # 🔴 LA SIGNATURE. Sans elle, le fichier est refusé au dépôt.
      # ⚠️ LA CLÉ NE VIT PAS DANS LE DÉPÔT : elle arrive en secret GitHub,
      # encodée en base64. Une clé de signature perdue, c'est une application
      # qu'on ne peut PLUS JAMAIS mettre à jour, jamais.
      #
      # 🔴 CETTE ÉTAPE ÉTAIT TOUJOURS SAUTÉE (corrigé le 17/09). Elle portait
      # `if: env.CLE_ANDROID_B64 != ''`, or un `if` est évalué AVANT l'étape, et
      # la variable n'existait que DANS son `env:`. La condition était donc
      # toujours fausse : le bundle sortait NON SIGNÉ, l'étape n'apparaissait
      # même pas en échec, et Google refusait le dépôt sans que rien n'explique
      # pourquoi. C'est le motif « une garde qui ne se déclenche jamais ».
      #
      # ⚠️ ET ELLE N'EST PLUS FACULTATIVE. Un paquet non signé n'a aucun usage :
      # mieux vaut que le travail échoue bruyamment que de produire un fichier
      # qu'on découvrira inutilisable au moment du dépôt.
      - name: Signer le bundle
        env:
          CLE_ANDROID_B64: ${{ secrets.CLE_ANDROID_B64 }}
          CLE_ANDROID_MDP: ${{ secrets.CLE_ANDROID_MDP }}
          CLE_ANDROID_ALIAS: ${{ secrets.CLE_ANDROID_ALIAS }}
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          for v in CLE_ANDROID_B64 CLE_ANDROID_MDP CLE_ANDROID_ALIAS; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Le secret $v manque. Sans les trois, le bundle ne peut pas etre signe."
              exit 1
            fi
          done
          echo "$CLE_ANDROID_B64" | base64 -d > cle.jks
          # 🔴 `jarsigner`, PAS `apksigner` : ce dernier ne traite que les APK et
          # refuse un Android App Bundle. Play App Signing resigne de toute
          # facon avec sa propre cle ; celle-ci n'est que la cle d'envoi.
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore cle.jks -storepass "$CLE_ANDROID_MDP" \
            "$AAB" "$CLE_ANDROID_ALIAS"
          # ⚠️ ON VÉRIFIE QUE LA SIGNATURE EST RÉELLEMENT POSÉE. `jarsigner` peut
          # rendre 0 en n'ayant rien signé ; un artefact muet coûterait un dépôt.
          #
          # 🔴 ET NI LE CODE DE SORTIE NI `-strict` NE CONVIENNENT, les deux ont
          # été essayés sur un vrai paquet le 17/09 :
          #   • `-strict` ECHOUE sur un certificat auto-signé (code 4). Or une
          #     clé de signature Android est TOUJOURS auto-signée : aucune
          #     autorité ne délivre ce genre de certificat. La garde rejetait
          #     donc exactement le cas normal, et le bundle etait pourtant signé.
          #   • sans `-strict`, `jarsigner -verify` rend 0 MEME SUR UN JAR NON
          #     SIGNE, en affichant « jar is unsigned ». Elle ne protégeait plus
          #     de rien.
          # On lit donc la phrase que jarsigner écrit, qui est sans ambiguïté.
          jarsigner -verify "$AAB" | tee verif.txt
          if ! grep -q "jar verified" verif.txt; then
            echo "::error::Le bundle n est PAS signe. jarsigner n a pas ecrit « jar verified »."
            exit 1
          fi
          rm -f cle.jks verif.txt
          echo "Bundle signe et verifie."

      - name: Récupérer le paquet
        uses: actions/upload-artifact@v4
        with:
          name: yoppaa-android-${{ inputs.version_nom }}
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
